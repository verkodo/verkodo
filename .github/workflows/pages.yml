# The documentation site (verkodo.github.io/verkodo, later verkodo.dev): docs/ built with Jekyll and published with GitHub Actions on every change of
# docs/ on main; on a pull request only built. The workflow comes from falkoss/starterpack, pinned by commit.
name: Pages

on:
  push:
    branches: [main]
    paths: ["docs/**", ".github/workflows/pages.yml"]
  pull_request:
    paths: ["docs/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

# One publication at a time; a newer one replaces one that waits.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  docs:
    uses: falkoss/starterpack/.github/workflows/pages-jekyll.yml@2c52b61993152e0f7f3828a628869f1aef62f0f3
    with:
      source: docs
      publish: ${{ github.event_name != 'pull_request' }}
    permissions:
      contents: read
      pages: write
      id-token: write
