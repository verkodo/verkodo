# SPDX-License-Identifier: AGPL-3.0-or-later
# Format, lints and tests on Linux and macOS (required; add more targets where the core must run); the web app with
# its types from api/openapi.json; api/openapi.json up to date; dependencies (cargo deny). The licence check (REUSE)
# and a sign-off (DCO) on every commit of a pull request come from falkoss/starterpack, pinned by commit. Actions are
# pinned by commit, with the version as a comment.
name: CI

on:
  push:
    branches: [main]
    # A version tag publishes the crates (job `crates`).
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The toolchain first: the web app needs the WebAssembly module of crates/verkodo-wasm.
      - name: Rust toolchain from rust-toolchain.toml (with the WebAssembly target)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
      # Then the web app: the binary embeds its build.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Web app – install, types from api/openapi.json up to date, WebAssembly, check, build
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm api
          git diff --exit-code src/lib/api-types.ts
          pnpm wasm
          pnpm check
          pnpm build
          pnpm build:pages
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets
      - run: cargo clippy --locked -p verkodo-wasm --target wasm32-unknown-unknown
      - run: cargo test --locked
      - name: api/openapi.json matches the code
        run: |
          cargo run --locked -q -p verkodo -- openapi > api/openapi.json
          git diff --exit-code api/openapi.json

  # The VS Code extension (editors/vscode): types, the grammar tested as VS Code tokenizes, a package.
  vscode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: editors/vscode/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: editors/vscode/pnpm-lock.yaml
      - name: Install, build, test the grammar, package
        working-directory: editors/vscode
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm package

  # From a version tag `v*` on main, once the checks passed: every crate but verkodo-wasm to crates.io, in the order
  # they depend on each other, by Trusted Publishing (no token; the environment `crates-io` asks the maintainer to
  # approve). A crate's first version is published by hand – Trusted Publishing can only be set up for a crate that
  # exists. Versions already on crates.io are skipped, so a run can be started again.
  crates:
    needs: [rust, licences]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Rust toolchain from rust-toolchain.toml (with the WebAssembly target)
        run: rustup toolchain install
      - name: The tag is on main and names the workspace's version
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_REF_NAME is not on main: release a commit of main"; exit 1; }
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "verkodo") | .version')
          test "v$version" = "$GITHUB_REF_NAME" \
            || { echo "::error::the crates are $version, the tag $GITHUB_REF_NAME"; exit 1; }
      # verkodo-web carries the web editor (crates/verkodo-web/web), so it is built first.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Web app with its WebAssembly module
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm wasm
          pnpm build
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          # The web editor in crates/verkodo-web/web is built, not committed: cargo counts it as a change, so
          # verkodo-web is published with --allow-dirty – once nothing tracked has changed.
          git diff --quiet HEAD || { echo "::error::tracked files changed during the build"; exit 1; }
          version="${GITHUB_REF_NAME#v}"
          for crate in syntax core lean render sdk api lsp web ""; do
            name="verkodo${crate:+-$crate}"
            if curl -fsS -A "verkodo release (https://github.com/verkodo/verkodo)" \
                 "https://crates.io/api/v1/crates/$name/$version" >/dev/null 2>&1; then
              echo "$name $version is on crates.io already"; continue
            fi
            dirty=""
            [ "$name" = verkodo-web ] && dirty="--allow-dirty"
            cargo publish --locked $dirty -p "$name"
          done

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
  licences:
    uses: falkoss/starterpack/.github/workflows/reuse.yml@2c52b61993152e0f7f3828a628869f1aef62f0f3
  sign-off:
    uses: falkoss/starterpack/.github/workflows/dco.yml@2c52b61993152e0f7f3828a628869f1aef62f0f3
