# SPDX-License-Identifier: AGPL-3.0-or-later
# Licence and copyright of files that cannot carry a header (REUSE specification 3.3). Source files name their own
# licence in an SPDX header.
version = 1

[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "falkOSS – Falcon Lake Open Source Software gUG (haftungsbeschränkt) i. G. and the verkodo contributors"

[[annotations]]
# Generated or JSON files of the Rust core and web app, if there are any (bin/new-project --rust-app).
path = ["**/*.md", "**/.gitignore", "Cargo.lock", "api/openapi.json", "web/package.json", "web/pnpm-lock.yaml",
  "web/tsconfig.json", "web/src/lib/api-types.ts", "lean/lean-toolchain", "lean/lake-manifest.json",
  "editors/vscode/*.json", "editors/vscode/syntaxes/*.json", "editors/vscode/pnpm-lock.yaml",
  "editors/vscode/.vscodeignore"]
precedence = "aggregate"
SPDX-FileCopyrightText = "falkOSS – Falcon Lake Open Source Software gUG (haftungsbeschränkt) i. G. and the verkodo contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Copies of the artwork from verkodo/brand – kept as they are, under its licence.
[[annotations]]
path = ["docs/assets/**", "web/public/favicon.svg", "editors/vscode/icon.png"]
precedence = "override"
SPDX-FileCopyrightText = "falkOSS – Falcon Lake Open Source Software gUG (haftungsbeschränkt) i. G."
SPDX-License-Identifier = "CC-BY-ND-4.0"
