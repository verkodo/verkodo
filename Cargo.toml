# SPDX-License-Identifier: AGPL-3.0-or-later
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-or-later"
repository = "https://github.com/verkodo/verkodo"
homepage = "https://verkodo.dev"
# Each crate is published on crates.io but verkodo-wasm, the web editor's module (crates/*/Cargo.toml).
publish = false

# The lowest version each crate needs; Cargo.lock holds the exact ones, each the newest that is at least 14 days old
# (scripts/check-age.py). Ranges, not exact versions, so that programs building verkodo's crates in can resolve them
# with their own dependencies.
[workspace.dependencies]
verkodo-api = { path = "crates/verkodo-api", version = "0.2.0" }
verkodo-core = { path = "crates/verkodo-core", version = "0.2.0" }
verkodo-lean = { path = "crates/verkodo-lean", version = "0.2.0" }
verkodo-lsp = { path = "crates/verkodo-lsp", version = "0.2.0" }
verkodo-render = { path = "crates/verkodo-render", version = "0.2.0" }
verkodo-sdk = { path = "crates/verkodo-sdk", version = "0.2.0" }
verkodo-syntax = { path = "crates/verkodo-syntax", version = "0.2.0" }
verkodo-web = { path = "crates/verkodo-web", version = "0.2.0" }
anyhow = "1.0.104"
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive"] }
crossbeam-channel = "0.5.17"
getrandom = "0.4.3"
http-body-util = "0.1.5"
lsp-server = "0.10.0"
rust-embed = { version = "8.13.0", features = ["mime-guess"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "signal"] }
tower = { version = "0.5.3", features = ["util"] }
utoipa = { version = "6.0.0", features = ["axum_extras"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
